services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vendor
      POSTGRES_USER: vendor
      POSTGRES_PASSWORD: vendor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendor -d vendor"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://vendor:vendor@db:5432/vendor
      ADMIN_TOKEN: change-me
      TOKEN_SECRET: change-me
      AI_MODE: ${AI_MODE:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      TZ: Asia/Dubai
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
